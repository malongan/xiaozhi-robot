<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>音乐播放器 · 浅色 iPod 皮肤预览</title>
<style>
  :root {
    --body-1: #e8eaed;
    --body-2: #cfd3d8;
    --body-3: #b6bbc2;
    --bezel: #c3c8ce;
    --bezel-ring: rgba(255, 255, 255, .9);
    --bezel-shadow: 0 10px 24px rgba(60, 70, 85, .28), inset 0 0 0 1px #a8afb7;
    --lcd: linear-gradient(180deg, #ffffff 0%, #f3f5f7 100%);
    --lcd-border: #b9c0c7;
    --status: linear-gradient(180deg, #dfe9f4 0%, #c3d6ea 100%);
    --status-border: #93a6ba;
    --ink: #1f242b;
    --muted: #6f7885;
    --dim: #8b94a1;
    --accent: #2f7ce8;
    --track: #cfd6de;
    --bar-bg: #dde2e7;
    --row-bg: #f7f8fa;
    --row-line: #e4e8ec;
    --wheel: radial-gradient(125% 125% at 50% 15%, #f7f8f9 0%, #e6e8eb 46%, #cfd3d8 100%);
    --wheel-border: #b0b6bd;
    --wheel-shadow: 0 4px 10px rgba(60, 70, 85, .2), inset 0 1px 0 #fff;
    --wheel-ink: #8d949d;
    --hub: radial-gradient(120% 120% at 50% 30%, #eef0f2 0%, #dcdfe3 55%, #c3c8ce 100%);
    --hub-border: #b3b9c0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: radial-gradient(900px 600px at 50% 0%, #eef1f4 0%, #e3e7eb 60%, #d8dde2 100%);
    color: #4a525c;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    padding: 36px 40px 44px;
  }
  h1 { font-size: 17px; color: #2b323a; margin: 0 0 4px; font-weight: 600; }
  .note { font-size: 12px; color: #7b848e; margin: 0 0 26px; line-height: 1.7; }
  .stage { display: flex; gap: 52px; align-items: flex-start; }
  .frame-wrap { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .caption { font-size: 12px; color: #6f7885; }

  .device {
    position: relative; width: 240px; height: 320px;
    transform: scale(2); transform-origin: top left;
    background: linear-gradient(160deg, var(--body-1) 0%, var(--body-2) 55%, var(--body-3) 100%);
    border-radius: 12px;
    box-shadow: var(--bezel-shadow);
  }
  .device-slot { width: 480px; height: 640px; }

  .bezel { position: absolute; left: 8px; top: 8px; width: 224px; height: 176px;
    background: var(--bezel); border-radius: 16px;
    box-shadow: inset 0 0 0 1px var(--bezel-ring), 0 2px 5px rgba(60,70,85,.18); }
  .lcd { position: absolute; left: 16px; top: 16px; width: 208px; height: 160px;
    background: var(--lcd); border-radius: 10px; overflow: hidden;
    box-shadow: inset 0 0 0 1px var(--lcd-border); }

  .status { position: absolute; left: 0; top: 0; width: 208px; height: 14px;
    background: var(--status); border-bottom: 1px solid var(--status-border); }
  .status .t { position: absolute; left: 5px; top: 0; font-size: 8px; line-height: 13px; color: #2c3947; }
  .status .batt { position: absolute; right: 5px; top: 3px; width: 22px; height: 8px;
    border: 1px solid #6d7b8a; border-radius: 2px; }
  .status .batt::after { content: ""; position: absolute; left: 1px; top: 1px; width: 15px; height: 4px;
    background: #6fbf4a; border-radius: 1px; }
  .status .play { position: absolute; right: 31px; top: 1px; font-size: 8px; color: #2c3947; }

  .back { position: absolute; left: 4px; top: 16px; width: 20px; height: 22px;
    font-size: 15px; line-height: 22px; text-align: center; color: var(--muted); }
  .title { position: absolute; left: 24px; top: 16px; width: 100px; height: 22px;
    font-size: 13px; line-height: 22px; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pager { position: absolute; right: 8px; top: 16px; height: 22px; display: flex; align-items: center; gap: 2px; }
  .pager .btn { width: 20px; text-align: center; font-size: 13px; color: var(--muted); }
  .pager .btn.off { color: #c8ced5; }
  .pager .count { min-width: 32px; text-align: center; font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .list { position: absolute; left: 6px; top: 44px; width: 196px; height: 112px; }
  .row { position: absolute; left: 2px; width: 188px; height: 22px;
    display: flex; align-items: center; padding: 0 8px;
    font-size: 12px; color: var(--ink); background: var(--row-bg);
    border-bottom: 1px solid var(--row-line); }
  .row:last-child { border-bottom: none; }
  .row .sub { margin-left: auto; color: var(--dim); font-size: 10px; }
  .scrollbar { position: absolute; right: 2px; top: 0; width: 2px; height: 112px; background: var(--bar-bg); border-radius: 2px; }
  .scrollbar .thumb { position: absolute; left: 0; width: 2px; border-radius: 2px; background: #9aa3ae; }

  .wheel { position: absolute; left: 60px; top: 196px; width: 120px; height: 120px; border-radius: 50%;
    background: var(--wheel); border: 1px solid var(--wheel-border); box-shadow: var(--wheel-shadow); }
  .wheel .menu { position: absolute; left: 0; right: 0; top: 7px; text-align: center;
    font-size: 8px; letter-spacing: 1.4px; color: var(--wheel-ink); font-weight: 600; }
  .wheel .side { position: absolute; top: 50%; transform: translateY(-50%); width: 26px; text-align: center;
    font-size: 12px; color: var(--wheel-ink); }
  .wheel .prev { left: 7px; } .wheel .next { right: 7px; }
  .wheel .play { position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; font-size: 12px; color: #46505c; }
  .hub { position: absolute; left: 40px; top: 40px; width: 40px; height: 40px; border-radius: 50%;
    background: var(--hub); border: 1px solid var(--hub-border);
    box-shadow: inset 0 1px 3px rgba(0,0,0,.08); }
</style>
</head>
<body>
  <h1>浅色 iPod 皮肤 · 预览</h1>
  <p class="note">白色机身 + 浅灰边框、白色点轮、浅蓝状态条；保留页码翻页按钮与细滚动条，配色对应浅色主题。</p>

  <div class="stage">
    <div class="frame-wrap">
      <div class="caption">歌曲列表 · 第 1 页</div>
      <div class="device-slot"><div class="device">
        <div class="bezel"></div>
        <div class="lcd">
          <div class="status"><span class="t">10:24</span><span class="play">▶</span><span class="batt"></span></div>
          <div class="back">‹</div>
          <div class="title">歌曲</div>
          <div class="pager"><div class="btn off">‹</div><div class="count">1/12</div><div class="btn">›</div></div>
          <div class="list">
            <div class="row" style="top:0">晴天</div>
            <div class="row" style="top:22px">稻香</div>
            <div class="row" style="top:44px">七里香</div>
            <div class="row" style="top:66px">夜曲</div>
            <div class="row" style="top:88px">告白气球</div>
            <div class="scrollbar"><div class="thumb" style="top:0;height:47px"></div></div>
          </div>
        </div>
        <div class="wheel">
          <div class="menu">MENU</div><div class="side prev">⏮</div><div class="side next">⏭</div>
          <div class="play">▶</div><div class="hub"></div>
        </div>
      </div></div>
    </div>

    <div class="frame-wrap">
      <div class="caption">正在播放 · 第 2 页</div>
      <div class="device-slot"><div class="device">
        <div class="bezel"></div>
        <div class="lcd">
          <div class="status"><span class="t">10:25</span><span class="play">❚❚</span><span class="batt"></span></div>
          <div class="back">‹</div>
          <div class="title">正在播放</div>
          <div class="pager"><div class="btn">‹</div><div class="count">2/12</div><div class="btn">›</div></div>
          <div class="list">
            <div class="row" style="top:0">简单爱</div>
            <div class="row" style="top:22px">东风破</div>
            <div class="row" style="top:44px">青花瓷</div>
            <div class="row" style="top:66px">龙卷风</div>
            <div class="row" style="top:88px">星晴</div>
            <div class="scrollbar"><div class="thumb" style="top:7px;height:47px"></div></div>
          </div>
        </div>
        <div class="wheel">
          <div class="menu">MENU</div><div class="side prev">⏮</div><div class="side next">⏭</div>
          <div class="play">❚❚</div><div class="hub"></div>
        </div>
      </div></div>
    </div>
  </div>
</body>
</html>
